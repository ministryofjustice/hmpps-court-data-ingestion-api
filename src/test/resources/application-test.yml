spring:
  datasource:
    url: 'jdbc:postgresql://localhost:5432/court_data_ingestion'
    username: court_data_ingestion
    password: court_data_ingestion


server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"
hmcts-auth:
  url: "http://localhost:8091"

# Wiremock core-person-api
core:
  person:
    api:
      url: http://localhost:8332

# Wiremock hmcts-api
hmcts:
  subscription:
    api:
      url: http://localhost:8333
  courthouse:
    api:
      url: http://localhost:8338
  court:
    schedule:
      api:
        url: http://localhost:8337
    defendant:
      api:
        url: http://localhost:8339

hmpps.document:
  management:
    api:
      url: http://localhost:8334

hmpps:
  court-cases-release-dates:
    api:
      url: http://localhost:8335
  court-register:
    api:
      url: http://localhost:8340

# Wiremock prisoner-search-api
prisoner:
  search:
    api:
      url: http://localhost:8336

hmpps.sqs:
  provider: localstack
  topics:
    domainevents:
      arn: arn:aws:sns:eu-west-2:000000000000:11111111-2222-3333-4444-555555555555
  queues:
    courtdataingestion:
      queueName: "courtdataingestion-${random.uuid}"
      dlqName: "courtdataingestion-dlq-${random.uuid}"
      dlqMaxReceiveCount: 3
      visibilityTimeout: 120
    courtwarranttest:
      queueName: court-warrant-test-event-queue
      dlqName: court-warrant-test-event-dlq
      subscribeTopicId: domainevents
      subscribeFilter: '{"eventType":[ "court-document.file.received" ] }'
    prisonercreated:
      queueName: "prisonercreated-${random.uuid}"
      dlqName: "prisonercreated-dlq-${random.uuid}"
      dlqMaxReceiveCount: 3
      visibilityTimeout: 120

hmpps.secret:
  provider: localstack
  localstackUrl: http://localhost:4566

hmcts-api-config:
  enabled: true
  callback-url: "https://localhost:1234/test"
  subscription-key: "KEY_1234"
  event-types: "PRISON_COURT_REGISTER_GENERATED, WEE_CustodialSentenceWitness"
  update-subscription-on-startup: true
  rate-limit: 100

environment:
  name: test

feature-toggles:
  defendant-resolution: true

extraction:
  mirror:
    metadata-version: 2