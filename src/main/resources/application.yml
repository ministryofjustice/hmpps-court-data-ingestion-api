info.app:
  name: HMPPS Court Data Ingestion Api
  version: 1.0

spring:
  application:
    name: hmpps-court-data-ingestion-api

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none

  datasource:
    url: 'jdbc:postgresql://${DB_SERVER}/${DB_NAME}?sslmode=verify-full'
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      pool-name: CourtDataIngestion-DB-CP
      connectionTimeout: 1000
      validationTimeout: 500

  flyway:
    locations: classpath:/migration/postgres
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${hmpps-auth.url}/.well-known/jwks.json

      client:
        provider:
          hmpps-auth:
            token-uri: ${hmpps-auth.url}/oauth/token
          hmcts-auth:
            token-uri: ${hmcts-auth.url}/oauth2/v2.0/token

        registration:
          core-person-api:
            provider: hmpps-auth
            client-id: ${client.creds.client.id}
            client-secret: ${client.creds.client.secret}
            authorization-grant-type: client_credentials
          hmpps-document-management-api:
            provider: hmpps-auth
            client-id: ${client.creds.client.id}
            client-secret: ${client.creds.client.secret}
            authorization-grant-type: client_credentials
          hmpps-court-cases-release-dates-api:
            provider: hmpps-auth
            client-id: ${client.creds.client.id}
            client-secret: ${client.creds.client.secret}
            authorization-grant-type: client_credentials
          hmcts-subscription-api:
            provider: hmcts-auth
            client-id: ${hmcts.client.creds.client.id}
            client-secret: ${hmcts.client.creds.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - ${hmcts.client.creds.client.subscription.scope}
          hmcts-courthouse-api:
            provider: hmcts-auth
            client-id: ${hmcts.client.creds.client.id}
            client-secret: ${hmcts.client.creds.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - ${hmcts.client.creds.client.courthouse.scope}
          hmcts-court-schedule-api:
            provider: hmcts-auth
            client-id: ${hmcts.client.creds.client.id}
            client-secret: ${hmcts.client.creds.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - ${hmcts.client.creds.client.court.schedule.scope}
          prisoner-search-api:
            provider: hmpps-auth
            client-id: ${client.creds.client.id}
            client-secret: ${client.creds.client.secret}
            authorization-grant-type: client_credentials
  http:
    codecs:
      max-in-memory-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include:
          - info
          - health
          - extractionbackfill
          - hashbackfill
          - corpussample
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

hmcts-api-config:
  enabled: ${HMCTS_SUBSCRIPTION_ENABLED}
  callback-url: ${HMCTS_SUBSCRIPTION_CALLBACK_URL}
  subscription-key: ${HMCTS_SUBSCRIPTION_KEY}
  event-types: ${HMCTS_EVENT_TYPES}
  update-subscription-on-startup: ${HMCTS_UPDATE_SUBSCRIPTION_ON_STARTUP}
  courthouse-key: ${HMCTS_COURTHOUSE_KEY}
  court-schedule-key: ${HMCTS_COURT_SCHEDULE_KEY}

extraction:
  backfill:
    ingested-from: "2026-05-18T16:38:15Z"
    error-cooldown: PT3H
  corpus-sampler:
    enabled: false