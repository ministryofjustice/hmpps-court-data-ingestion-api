name: Run

on:
  workflow_call:
    inputs:
      app_version:
        description: |
          App version used for the Docker image tag / Helm deploy.
          Not used for Pact Broker lookups - those always use github.sha,
          matching the version published during provider verification.
        required: true
        type: string

permissions:
  contents: read

jobs:
  pact_provider_verification_trigger:
    name: Trigger Pact Provider Verification
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.PACT_TRIGGER_APP_ID }}
          private-key: ${{ secrets.PACT_TRIGGER_PRIVATE_KEY }}
          owner: ministryofjustice
          permission-actions: write
          repositories: hmpps-person-record

      - name: Trigger external Pact provider verification workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'ministryofjustice',
              repo: 'hmpps-person-record',
              workflow_id: 'pact_provider_verification.yml',
              ref: 'main',
              inputs: {
                consumerName: '${{ github.repository }}',
                consumerBranch: '${{ github.ref_name }}',
                publishResults: 'true',
              }
            })