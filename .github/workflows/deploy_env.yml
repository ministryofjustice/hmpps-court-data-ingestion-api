name: Pact consumer test and publish

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        description: Environment
        required: true
        type: string
        default: 'dev'
      app_version:
        description: version to be deployed to the environment - must already exist.
        required: true
        default: ''
        type: string
jobs:
  deploy_to_env:
    name: Deploy to environment
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/pact_deploy_env.yml@1cd277cf487926d2f86fa68c87049e62a461d55e # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: '${{ inputs.environment }}'
      app_version: '${{ inputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
      pact_consumer_deployment: true