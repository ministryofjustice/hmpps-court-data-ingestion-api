name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable or testing tags
        required: false
        default: ''
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  # Only cancel in progress when on a branch - use SHA on main to ensure uniqueness.
  # This will allow multiple pipelines to run at the same time on main.
  # Note that two pipelines running within a few minutes of each other will cause issues with helm deploying to
  # a namespace, as the second one will not be able to get a lock as a deploy will be in progress.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
  HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}

jobs:
  helm_lint:
    strategy:
      matrix:
        environments: ['dev', 'preprod', 'prod']
    name: helm lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}
  app_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    steps:
      - id: app_version
        name: Application version creators
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/create_app_version@85dea2c43d9d69b5143817f8b84b71cf30d15df5 # WORKFLOW_VERSION
  gradle_verify:
    name: Validate the kotlin
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      gradle-command: 'HMPPS_PACT_BROKER_USERNAME=$HMPPS_PACT_BROKER_USERNAME HMPPS_PACT_BROKER_PASSWORD=$HMPPS_PACT_BROKER_PASSWORD GITHUB_BRANCH=${{ github.ref_name }} BUILD_NUMBER=${{ needs.app_version.outputs.version}} ./gradlew assemble check pactTest pactPublish'
      upload-build-artifacts: ${{ github.ref == 'refs/heads/main' }}
      java-version: "25"
    needs:
      - app_version
#  pact_publish:
#    name: Publish Pact contracts to broker
#    needs:
#      - app_version
#      - gradle_verify
#    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
#    secrets: inherit
#    with:
#      gradle-command: 'HMPPS_PACT_BROKER_USERNAME=$HMPPS_PACT_BROKER_USERNAME HMPPS_PACT_BROKER_PASSWORD=$HMPPS_PACT_BROKER_PASSWORD GITHUB_BRANCH=${{ github.ref_name }} ./gradlew pactTest pactPublish'
#      java-version: "25"
#      upload-test-artifacts: false
#      upload-build-artifacts: false
  build:
    name: Build docker image from hmpps-github-actions
    if: github.ref == 'refs/heads/main'
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2 # WORKFLOW_VERSION
    needs:
      - gradle_verify
#      - pact_publish
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      push: ${{ inputs.push || inputs.push == null }}
      docker_multiplatform: false
      download_build_artifacts: true
  # TODO (CDIA-337): move the call to common deploy_env action to a local deploy_env version which should include can_i_deply, deploy and record_deploy call to the hmpps common ones
  # TODO (CDIA-337): Waiting for can_i_deploy and record_deployment to be added to deploy_env common action
  deploy_dev:
    name: Deploy to the development environment
    needs:
      - build
      - helm_lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'dev'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  # TODO (CDIA-337): This will go away along with deploy_dev as par to of new local deploy_env
  pact_record_deployment_dev:
    name: Pact record deployment
    needs:
      - deploy_dev
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/pact_record_deployment.yml@v2
    with:
      pacticipant: hmpps-court-data-ingestion-api
      app_version: ${{ inputs.version }}
      environment: 'dev'
    secrets: inherit
  deploy_preprod:
     name: Deploy to pre-production environment
     needs:
       - build
       - deploy_dev
     uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
     secrets: inherit
     with:
       environment: 'preprod'
       app_version: '${{ needs.build.outputs.app_version }}'
       slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_prod:
     name: Deploy to production environment
     needs:
       - build
       - deploy_preprod
     uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
     secrets: inherit
     with:
       environment: 'prod'
       app_version: '${{ needs.build.outputs.app_version }}'
       slack_notification: 'false' # if 'true', it needs a valid PROD_RELEASES_SLACK_CHANNEL variable to be set
