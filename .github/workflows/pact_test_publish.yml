name: Pact consumer test and publish

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      app_version:
        description: |
          App version used for the Docker image tag / Helm deploy.
          Not used for Pact Broker lookups - those always use github.sha,
          matching the version published during provider verification.
        required: true
        type: string
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
      PACT_BROKER_URL:
        required: true
      HMPPS_PACT_BROKER_USERNAME:
        required: true
      HMPPS_PACT_BROKER_PASSWORD:
        required: true

jobs:
  pact_test_publish:
    name: Pact consumer test and publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Run pact tests
        run: ./gradlew pactTest
      - name: Upload the test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pact-test-results
          path: |
            '**/build/test-results'
            '**/build/reports/tests'
      - name: Publish pacts
        run: ./gradlew pactPublish
        env:
          APP_VERSION: ${{ inputs.app_version }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
          HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
