---
# Per environment values which override defaults in hmpps-court-data-ingestion-api/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: court-data-ingestion-api-preprod.hmpps.service.justice.gov.uk

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    HMPPS_AUTH_URL: "https://sign-in-preprod.hmpps.service.justice.gov.uk/auth"
    CORE_PERSON_API_URL: "https://hmpps-person-record-preprod.hmpps.service.justice.gov.uk"
    PRISONER_SEARCH_API_URL: "https://prisoner-search-preprod.prison.service.justice.gov.uk"
    HMPPS_DOCUMENT_MANAGEMENT_API_URL: "https://document-api-preprod.hmpps.service.justice.gov.uk"
    HMPPS_COURT-CASES-RELEASE-DATES_API_URL: "https://court-cases-release-dates-api-preprod.hmpps.service.justice.gov.uk"
    HMCTS_SUBSCRIPTION_CALLBACK_URL: "https://hxpwmnx4ef.execute-api.eu-west-2.amazonaws.com/preproduction/ingest"
    HMCTS_SUBSCRIPTION_API_URL: "https://tmc.cjscp.org.uk/hrds"
    HMCTS_AUTH_URL: "https://login.microsoftonline.com/77f54315-6dde-4fe7-9e17-74762c3eb096"
    HMCTS_UPDATE_SUBSCRIPTION_ON_STARTUP: true
    HMCTS_EVENT_TYPES: "PRISON_COURT_REGISTER_GENERATED"
    HMCTS_SUBSCRIPTION_ENABLED: true

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: legacy-replacement-alerts-non-prod
  businessHoursOnly: true
  sqsAlertsQueueNames:
    - "calculate-release-dates-team-preprod-hmpps_court_data_ingestion_queue"
    - "calculate-release-dates-team-preprod-hmpps_court_data_ingestion_dlq"
    - "calculate-release-dates-team-preprod-hmpps_court_data_prisoner_created_queue"
    - "calculate-release-dates-team-preprod-hmpps_court_data_prisoner_created_dlq"
  sqsAlertsOldestThreshold: 2
  sqsAlertsTotalMessagesThreshold: 1
